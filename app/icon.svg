<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="NexusCommerce">
  <defs>
    <linearGradient id="nx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="52%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nx-bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8edff" />
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect width="48" height="48" rx="11" fill="url(#nx-bg)" />

  <!-- shopping bag: arc handle + body -->
  <path
    d="M18 17.5v-1.75a6 6 0 0 1 12 0v1.75"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <rect x="12.6" y="17.4" width="22.8" height="20.2" rx="3.4" fill="url(#nx-bag)" />

  <!-- spark detail so the mark reads as "fast delivery" -->
  <path d="M20.6 24.4h6.8l-3.4 4.1h3.1l-6.7 6.6 2-5h-2.9z" fill="#5b21b6" opacity="0.9" />
</svg>
